# Campos que el migrador scripts/migrar_opcionales conserva como primitivos,
# aunque la columna del SQL sea nullable.
#
# Formato: una línea por patrón "tabla.Campo". "tabla" es el nombre de tabla SQL
# (el de TableName() del modelo) y "Campo" es el nombre del campo en Go. El
# comodín "*" coincide con cualquier nombre y puede usarse en ambos lados:
#
#   *.UsuarioCreacionId   el campo en cualquier modelo
#   forma_pago.*          todos los campos del modelo de la tabla forma_pago
#   *.*                   todos los campos de todos los modelos
#
# Las líneas vacías y las que comienzan con "#" se ignoran. Un patrón que no
# coincide con ningún campo genera un warning y no detiene la ejecución.
#
# Por defecto se listan los campos de auditoría: los controladores los asignan
# por valor, así que deben seguir siendo primitivos.

*.Id
*.Activo
*.FechaCreacion
*.FechaModificacion
*.UsuarioCreacionId
*.UsuarioModificacionId
